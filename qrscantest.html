<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GD_MO_0900 재고실사</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>
/* ===== RESET ===== */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  width: 100%; height: 100%;
  background: #f5f5f5;
  font-family: 'Malgun Gothic', '맑은 고딕', -apple-system, sans-serif;
  color: #111;
  overflow: hidden;
}
body {
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

/* ===== HEADER ===== */
.header {
  background: #111; color: #fff;
  display: flex; align-items: center;
  height: 56px; padding: 0 16px;
  flex-shrink: 0;
}
.btn-back {
  background: none; border: none; color: #fff;
  font-size: 30px; line-height: 1;
  min-width: 52px; min-height: 52px;
  display: flex; align-items: center;
  cursor: pointer; padding: 0 12px 0 0;
}
.header-title {
  flex: 1; text-align: center;
  font-size: 18px; font-weight: 700; letter-spacing: -.3px;
  margin-right: 52px;
}

/* ===== BODY ===== */
.body {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #f5f5f5;
}

/* ===== 실사번호 ===== */
.inv-area {
  background: #fff;
  padding: 12px 16px;
  border-bottom: 1px solid #ddd;
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}
.inv-label {
  font-size: 13px; font-weight: 700; color: #555;
  white-space: nowrap;
}
.inv-value {
  font-size: 15px; font-weight: 800; color: #111;
  letter-spacing: .3px;
}

/* ===== QR SCAN AREA ===== */
.qr-area {
  background: #fff;
  padding: 12px 16px 10px;
  border-bottom: 2px solid #111;
  flex-shrink: 0;
}
.qr-viewport {
  width: 100%; height: 140px;
  background: #111; border: 2px solid #111;
  position: relative; overflow: hidden;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
#qrVideo {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; display: none;
}
#qrVideo.active { display: block; }
#qrCanvas { display: none; }

/* 스캔 라인 */
.scan-line {
  position: absolute; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255,255,255,.95) 50%,
    transparent 100%);
  display: none; z-index: 6;
  animation: scanMove 1.6s ease-in-out infinite;
}
.scan-line.active { display: block; }
@keyframes scanMove {
  0%   { top: 6%; }
  50%  { top: 88%; }
  100% { top: 6%; }
}

/* 코너 브라켓 */
.qr-corners {
  position: absolute; inset: 10px;
  pointer-events: none; z-index: 7;
}
.qr-corners::before, .qr-corners::after,
.qr-corners > span::before, .qr-corners > span::after {
  content: ''; position: absolute;
  width: 18px; height: 18px;
  border-color: #fff; border-style: solid;
}
.qr-corners::before         { top: 0;    left: 0;  border-width: 3px 0 0 3px; }
.qr-corners::after          { top: 0;    right: 0; border-width: 3px 3px 0 0; }
.qr-corners > span::before  { bottom: 0; left: 0;  border-width: 0 0 3px 3px; }
.qr-corners > span::after   { bottom: 0; right: 0; border-width: 0 3px 3px 0; }

/* 대기 상태 */
.state-idle {
  display: flex; flex-direction: column;
  align-items: center; gap: 8px;
  z-index: 4; pointer-events: none;
}
.qr-icon {
  width: 52px; height: 52px;
  border: 3px solid #555;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows:    1fr 1fr 1fr;
  gap: 3px; padding: 6px;
}
.qr-icon span       { background: #555; display: block; }
.qr-icon span.empty { background: transparent; }
.state-idle p       { font-size: 12px; color: #888; }

/* 에러 상태 */
.state-err {
  display: none; flex-direction: column;
  align-items: center; gap: 6px;
  z-index: 4; pointer-events: none;
  padding: 0 20px; text-align: center;
}
.state-err strong { font-size: 12px; color: #bbb; }
.state-err p      { font-size: 11px; color: #888; line-height: 1.6; }

/* 스캔 중 하단 안내 */
.scan-tip {
  position: absolute; bottom: 8px; left: 0; right: 0;
  text-align: center; font-size: 11px; font-weight: 600;
  color: rgba(255,255,255,.85); letter-spacing: .3px;
  z-index: 8; display: none;
}
.scan-tip.active { display: block; }

/* ===== LIST AREA ===== */
.list-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #f5f5f5;
}

/* 리스트 헤더 */
.list-hd {
  padding: 10px 16px;
  background: #e8e8e8; border-bottom: 1px solid #ddd;
  font-size: 12px; font-weight: 700; color: #555;
  letter-spacing: .4px;
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0;
}
.list-cnt { font-weight: 400; color: #888; font-size: 12px; }

/* 빈 상태 */
.empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px; padding: 32px 20px;
}
.empty-state p     { font-size: 14px; color: #888; text-align: center; line-height: 1.75; }
.empty-state small { font-size: 12px; color: #bbb; text-align: center; }

/* 스크롤 목록 */
.list-scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: none;
}
.list-scroll.on { display: block; }
.list-scroll::-webkit-scrollbar { width: 3px; }
.list-scroll::-webkit-scrollbar-track { background: #efefef; }
.list-scroll::-webkit-scrollbar-thumb { background: #ccc; }

/* 차량 카드 */
.v-card {
  background: #fff; border-bottom: 1px solid #e8e8e8;
  padding: 14px 16px;
  display: flex; gap: 14px; align-items: flex-start;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(-8px); background: #ddd; }
  to   { opacity: 1; transform: translateY(0);    background: #fff; }
}
.v-card.anim-new { animation: cardIn .3s ease forwards; }
@keyframes cardDup {
  0%, 100% { background: #fff; }
  30%      { background: #e0e0e0; }
}
.v-card.anim-dup { animation: cardDup .6s ease; }

/* 배지 */
.badge-wrap { flex-shrink: 0; padding-top: 2px; }
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 52px; height: 26px;
  font-size: 12px; font-weight: 800; letter-spacing: .8px;
  border: 2px solid #111; border-radius: 0;
  background: #111; color: #fff;
}

/* 카드 정보 */
.v-info { flex: 1; min-width: 0; }
.v-raw {
  font-size: 13px; font-weight: 700; color: #111;
  word-break: break-all; line-height: 1.5;
  font-family: 'Courier New', monospace; letter-spacing: .3px;
  margin-bottom: 5px;
}
.v-meta {
  font-size: 11px; color: #999; font-weight: 500;
  display: flex; gap: 10px; align-items: center;
}
.v-meta .v-seq { color: #ccc; }

/* ===== FOOTER ===== */
.footer {
  background: #fff; border-top: 2px solid #111;
  padding: 12px 16px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  flex-shrink: 0;
}
.btn-complete {
  width: 100%; height: 58px;
  background: #111; color: #fff;
  border: none; border-radius: 0;
  font-size: 17px; font-weight: 800;
  letter-spacing: 1px; font-family: inherit; cursor: pointer;
}
.btn-complete:active { background: #333; }

/* ===== DIALOG ===== */
.dlg-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  z-index: 2000; display: none;
  align-items: center; justify-content: center;
}
.dlg-overlay.on { display: flex; }
.dlg-box {
  background: #fff; width: min(88vw, 320px);
  border: 2px solid #111;
}
.dlg-msg {
  padding: 28px 20px 22px;
  font-size: 15px; color: #111; text-align: center;
  line-height: 1.7; font-weight: 500; word-break: keep-all;
}
.dlg-btns { display: flex; border-top: 1px solid #ddd; }
.dlg-btns button {
  flex: 1; height: 56px; border: none; border-radius: 0;
  font-size: 16px; font-weight: 700;
  cursor: pointer; background: #fff; color: #111; font-family: inherit;
}
.dlg-btns button + button { border-left: 1px solid #ddd; }
.dlg-btns button.primary  { background: #111; color: #fff; }

/* ===== TOAST ===== */
.toast {
  position: fixed; bottom: 90px; left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: #222; color: #fff;
  padding: 12px 22px; font-size: 14px; font-weight: 600;
  border-radius: 0; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 3000; max-width: 90vw;
  text-align: center; word-break: keep-all; line-height: 1.5;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <button class="btn-back" onclick="goBack()">&#8249;</button>
  <div class="header-title">재고실사</div>
</div>

<!-- BODY -->
<div class="body">

  <!-- 실사번호 -->
  <div class="inv-area">
    <span class="inv-label">실사번호</span>
    <span class="inv-value">INV-2026-05-001</span>
  </div>

  <!-- QR 스캔 -->
  <div class="qr-area">
    <div class="qr-viewport" id="qrViewport">

      <video id="qrVideo" playsinline autoplay muted></video>
      <canvas id="qrCanvas"></canvas>
      <div class="scan-line" id="scanLine"></div>
      <div class="qr-corners"><span></span></div>

      <!-- 대기 -->
      <div class="state-idle" id="stateIdle">
        <div class="qr-icon">
          <span></span><span></span><span></span>
          <span></span><span class="empty"></span><span></span>
          <span></span><span></span><span></span>
        </div>
        <p>터치하여 QR 스캔 시작</p>
      </div>

      <!-- 에러 -->
      <div class="state-err" id="stateErr">
        <strong>카메라를 사용할 수 없습니다</strong>
        <p>브라우저 카메라 권한을<br>확인해 주세요.</p>
      </div>

      <!-- 스캔 중 안내 -->
      <div class="scan-tip" id="scanTip">● 스캔 중 &nbsp;|&nbsp; 터치하면 종료</div>

    </div>
  </div>

  <!-- 리스트 영역 -->
  <div class="list-wrap">
    <div class="list-hd">
      <span>스캔 결과 목록</span>
      <span class="list-cnt" id="listCnt">0건</span>
    </div>
    <div class="empty-state" id="emptyState">
      <p>QR스캔을 진행해 주세요.</p>
      <small>위 QR 영역을 터치하면 카메라가 실행됩니다</small>
    </div>
    <div class="list-scroll" id="listScroll">
      <div id="vehicleList"></div>
    </div>
  </div>

</div><!-- /body -->

<!-- FOOTER -->
<div class="footer">
  <button class="btn-complete" onclick="showCompleteConfirm()">재고실사 처리</button>
</div>

<!-- DIALOG -->
<div class="dlg-overlay" id="dlgOverlay">
  <div class="dlg-box">
    <div class="dlg-msg" id="dlgMsg"></div>
    <div class="dlg-btns" id="dlgBtns"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ============================================================
   WEB AUDIO API
   - 안드로이드 크롬 대응: 매 beep()마다 await ensureAudioCtx()
   - square 파형: 모바일 스피커에서 선명하게 들림
   - 음량 엔벨로프: 클릭음/팝음 방지
   ============================================================ */
let audioCtx = null;

async function ensureAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    await audioCtx.resume();  /* ✅ await 필수 — suspended 완전 해제 보장 */
  }
}

function beep(freq, duration, volume = 0.5) {
  return new Promise(async resolve => {
    await ensureAudioCtx();   /* ✅ 매 beep 호출마다 상태 보장 */

    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.type = 'square';      /* ✅ sine → square: 모바일 스피커 최적화 */
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

    const t   = audioCtx.currentTime;
    const dur = duration / 1000;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(volume, t + 0.01);        /* 10ms fade-in */
    gain.gain.setValueAtTime(volume,          t + dur - 0.04);
    gain.gain.linearRampToValueAtTime(0,      t + dur);         /* 40ms fade-out */

    osc.start(t);
    osc.stop(t + dur);
    osc.onended = () => resolve();
  });
}

const wait = ms => new Promise(r => setTimeout(r, ms));

/* ✅ 스캔 성공: 삐삐 짧게 2번 (1200Hz / 80ms) */
async function beepSuccess() {
  await beep(1200, 80, 0.5);
  await wait(80);
  await beep(1200, 80, 0.5);
}

/* ❌ 스캔 실패: 삐~~~ 낮은 음 2초 (440Hz / 1900ms) */
async function beepFail() {
  await beep(440, 1900, 0.5);
}

/* ⚠️ 중복 스캔: 삐- 중간 1번 (800Hz / 150ms) */
async function beepDup() {
  await beep(800, 150, 0.4);
}

/* ============================================================
   STATE
   ============================================================ */
let scannedCount = 0;
let isScanning   = false;
let videoStream  = null;
let rafId        = null;
let hasResult    = false;
let lastQrData   = '';
let lastQrTime   = 0;

/*
  scannedList 항목: { id, rawData, scannedAt }
  index 0 = 가장 최근 스캔
*/
let scannedList = [];

/* ============================================================
   DOM refs
   ============================================================ */
const qrViewport = document.getElementById('qrViewport');
const qrVideo    = document.getElementById('qrVideo');
const qrCanvas   = document.getElementById('qrCanvas');
const scanLine   = document.getElementById('scanLine');
const scanTip    = document.getElementById('scanTip');
const stateIdle  = document.getElementById('stateIdle');
const stateErr   = document.getElementById('stateErr');

/* ============================================================
   QR 뷰포트 터치 → AudioContext 초기화 + 카메라 ON/OFF
   ✅ async 핸들러: ensureAudioCtx() await 보장
   ============================================================ */
qrViewport.addEventListener('click', async () => {
  await ensureAudioCtx();   /* ✅ 터치 시점(사용자 제스처)에서 즉시 초기화 */
  isScanning ? stopCamera() : startCamera();
});

/* ============================================================
   START CAMERA
   ============================================================ */
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment',
        width:  { ideal: 1920 },
        height: { ideal: 1080 }
      }
    });

    videoStream       = stream;
    qrVideo.srcObject = stream;
    await qrVideo.play();
    qrVideo.classList.add('active');

    stateIdle.style.display = 'none';
    stateErr.style.display  = 'none';
    scanLine.classList.add('active');
    scanTip.classList.add('active');
    isScanning = true;

    scanLoop();

  } catch (err) {
    console.warn('[Camera Error]', err.name, err.message);
    stateIdle.style.display = 'none';
    stateErr.style.display  = 'flex';
    isScanning = false;
  }
}

/* ============================================================
   STOP CAMERA
   ============================================================ */
function stopCamera() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }

  if (videoStream) {
    videoStream.getTracks().forEach(t => t.stop());
    videoStream = null;
  }
  qrVideo.srcObject = null;
  qrVideo.classList.remove('active');

  scanLine.classList.remove('active');
  scanTip.classList.remove('active');
  stateIdle.style.display = 'flex';
  stateErr.style.display  = 'none';
  isScanning = false;
  lastQrData = '';
  lastQrTime = 0;
}

/* ============================================================
   SCAN LOOP — requestAnimationFrame + jsQR
   매 프레임 캔버스 캡처 → jsQR 디코딩
   ============================================================ */
function scanLoop() {
  if (!isScanning) return;

  if (qrVideo.readyState === qrVideo.HAVE_ENOUGH_DATA) {
    const w = qrVideo.videoWidth;
    const h = qrVideo.videoHeight;

    if (w > 0 && h > 0) {
      qrCanvas.width  = w;
      qrCanvas.height = h;
      const ctx = qrCanvas.getContext('2d');
      ctx.drawImage(qrVideo, 0, 0, w, h);

      const imgData = ctx.getImageData(0, 0, w, h);
      const code    = jsQR(imgData.data, w, h, { inversionAttempts: 'dontInvert' });

      if (code) {
        const now  = Date.now();
        const data = code.data.trim();

        /* 동일 QR 2초 쿨다운 — 연속 중복 인식 방지 */
        if (data !== lastQrData || now - lastQrTime > 2000) {
          lastQrData = data;
          lastQrTime = now;
          processScan(data);
        }
      }
    }
  }

  rafId = requestAnimationFrame(scanLoop);
}

/* ============================================================
   PROCESS SCAN
   - QR 원문 그대로 사용 (vehicleDB 없음)
   - 신규: 성공음 / 중복: 중복음 / 빈데이터: 실패음
   ============================================================ */
function processScan(rawData) {
  /* 빈 데이터 방어 */
  if (!rawData || rawData.length === 0) {
    beepFail();
    showToast('QR 인식 실패');
    return;
  }

  const now      = new Date();
  const existIdx = scannedList.findIndex(item => item.id === rawData);

  if (existIdx !== -1) {
    /* ⚠️ 중복 스캔: 최상단 이동 + 시각 갱신 */
    const item = scannedList.splice(existIdx, 1)[0];
    item.scannedAt = now;
    scannedList.unshift(item);
    beepDup();
    renderList('dup', rawData);
    showToast('이미 스캔된 QR입니다.');

  } else {
    /* ✅ 신규 스캔: 최상단 추가 */
    scannedCount++;
    scannedList.unshift({ id: rawData, rawData, scannedAt: now });
    beepSuccess();
    renderList('new', rawData);
    showToast('스캔 완료');
  }

  showResults();
}

/* ============================================================
   RENDER LIST
   - scannedList 순서 그대로 (index 0 = 최신)
   - QR 원문 그대로 카드에 표시
   ============================================================ */
function renderList(animType, targetId) {
  const container = document.getElementById('vehicleList');
  container.innerHTML = '';

  scannedList.forEach((item, idx) => {
    const card = document.createElement('div');
    let   cls  = 'v-card';
    if (item.id === targetId) {
      cls += animType === 'new' ? ' anim-new' : ' anim-dup';
    }
    card.className = cls;
    card.setAttribute('data-id', item.id);

    const t    = item.scannedAt;
    const hh   = String(t.getHours()).padStart(2, '0');
    const mm   = String(t.getMinutes()).padStart(2, '0');
    const ss   = String(t.getSeconds()).padStart(2, '0');
    const tStr = `${hh}:${mm}:${ss}`;
    const seq  = idx + 1;

    card.innerHTML = `
      <div class="badge-wrap">
        <span class="badge">스캔</span>
      </div>
      <div class="v-info">
        <div class="v-raw">${escHtml(item.rawData)}</div>
        <div class="v-meta">
          <span class="v-time">${tStr}</span>
          <span class="v-seq"># ${seq}</span>
        </div>
      </div>`;
    container.appendChild(card);
  });

  document.getElementById('listCnt').textContent      = scannedList.length + '건';
  document.getElementById('listScroll').scrollTop     = 0;
}

/* XSS 방지 */
function escHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ============================================================
   SHOW RESULTS
   ============================================================ */
function showResults() {
  if (!hasResult) {
    hasResult = true;
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('listScroll').classList.add('on');
  }
}

/* ============================================================
   COMPLETE
   ============================================================ */
function showCompleteConfirm() {
  if (scannedCount === 0) {
    showDlg('스캔된 차량이 없습니다.\nQR스캔 후 진행해 주세요.', [
      { label: '확인', cls: 'primary', fn: closeDlg }
    ]);
    return;
  }
  showDlg(
    `스캔 완료 ${scannedCount}건을\n재고실사 처리하시겠습니까?\n\n처리 후 수정이 불가합니다.`,
    [
      { label: '취소', cls: '',        fn: closeDlg },
      { label: '확인', cls: 'primary', fn: doComplete }
    ]
  );
}

function doComplete() {
  closeDlg();
  stopCamera();
  showToast('재고실사 처리가 완료되었습니다.');
  setTimeout(() => {
    scannedList  = [];
    scannedCount = 0;
    hasResult    = false;
    document.getElementById('emptyState').style.display = 'flex';
    document.getElementById('listScroll').classList.remove('on');
    document.getElementById('vehicleList').innerHTML     = '';
    document.getElementById('listCnt').textContent       = '0건';
  }, 2400);
}

/* ============================================================
   BACK
   ============================================================ */
function goBack() {
  showDlg('재고실사 화면을 나가시겠습니까?', [
    { label: '취소',   cls: '',        fn: closeDlg },
    { label: '나가기', cls: 'primary', fn: () => {
        closeDlg();
        stopCamera();
        showToast('LNB 메뉴로 이동합니다.');
      }
    }
  ]);
}

/* ============================================================
   DIALOG
   ============================================================ */
function showDlg(msg, buttons) {
  document.getElementById('dlgMsg').innerHTML = msg.replace(/\n/g, '<br>');
  const wrap = document.getElementById('dlgBtns');
  wrap.innerHTML = '';
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.textContent = b.label;
    if (b.cls === 'primary') btn.classList.add('primary');
    btn.addEventListener('click', b.fn);
    wrap.appendChild(btn);
  });
  document.getElementById('dlgOverlay').classList.add('on');
}
function closeDlg() {
  document.getElementById('dlgOverlay').classList.remove('on');
}

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}
</script>
</body>
</html>
