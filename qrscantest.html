<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GD_MO_0900 재고실사</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>
/* ===== RESET ===== */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html { font-size: 16px; }
body {
  width: 100%;
  min-height: 100dvh;
  background: #f5f5f5;
  font-family: 'Malgun Gothic', '맑은 고딕', -apple-system, sans-serif;
  color: #111;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ===== STATUS BAR ===== */
.status-bar {
  background: #111; color: #fff;
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 20px 8px;
  flex-shrink: 0; height: 44px;
}
.status-bar .time { font-size: 14px; font-weight: 700; }
.status-bar .icons { display: flex; gap: 6px; align-items: center; }
.signal { display: flex; gap: 2px; align-items: flex-end; height: 14px; }
.signal span { width: 3px; background: #fff; border-radius: 1px; }
.signal span:nth-child(1) { height: 4px; }
.signal span:nth-child(2) { height: 7px; }
.signal span:nth-child(3) { height: 10px; }
.signal span:nth-child(4) { height: 14px; }
.net-label { font-size: 11px; font-weight: 600; letter-spacing: .3px; }
.battery { display: flex; align-items: center; gap: 2px; }
.batt-body {
  width: 24px; height: 12px;
  border: 1.5px solid #fff; border-radius: 2px;
  padding: 2px; display: flex; align-items: center;
}
.batt-fill { width: 88%; height: 100%; background: #fff; border-radius: 1px; }
.batt-cap  { width: 2px; height: 6px; background: #fff; border-radius: 0 1px 1px 0; }
.batt-pct  { font-size: 11px; font-weight: 600; }

/* ===== HEADER ===== */
.header {
  background: #111; color: #fff;
  display: flex; align-items: center;
  height: 56px; padding: 0 16px;
  flex-shrink: 0; border-bottom: 1px solid #222;
}
.btn-back {
  background: none; border: none; color: #fff;
  font-size: 30px; line-height: 1;
  min-width: 52px; min-height: 52px;
  display: flex; align-items: center;
  cursor: pointer; padding: 0 12px 0 0;
}
.header-title {
  flex: 1; text-align: center;
  font-size: 18px; font-weight: 700; letter-spacing: -.3px;
  margin-right: 52px;
}

/* ===== BODY ===== */
.body {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden; background: #f5f5f5;
}

/* ===== 실사번호 텍스트 영역 ===== */
.inv-area {
  background: #fff;
  padding: 13px 16px;
  border-bottom: 1px solid #ddd;
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}
.inv-label {
  font-size: 14px; font-weight: 700; color: #555;
  white-space: nowrap;
}
.inv-value {
  font-size: 15px; font-weight: 800; color: #111;
  letter-spacing: .3px;
}

/* ===== QR SCAN AREA ===== */
.qr-area {
  background: #fff;
  padding: 14px 16px 12px;
  border-bottom: 1px solid #ddd;
  flex-shrink: 0;
}
.qr-viewport {
  width: 100%; height: 210px;
  background: #111; border: 2px solid #111;
  position: relative; overflow: hidden;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
#qrVideo {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; display: none;
}
#qrVideo.active { display: block; }
#qrCanvas { display: none; }

/* 스캔 라인 */
.scan-line {
  position: absolute; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.95) 50%, transparent 100%);
  display: none; z-index: 6;
  animation: scanMove 1.8s ease-in-out infinite;
}
.scan-line.active { display: block; }
@keyframes scanMove { 0%{top:6%} 50%{top:90%} 100%{top:6%} }

/* 코너 브라켓 */
.qr-corners { position: absolute; inset: 14px; pointer-events: none; z-index: 7; }
.qr-corners::before, .qr-corners::after,
.qr-corners > span::before, .qr-corners > span::after {
  content: ''; position: absolute;
  width: 22px; height: 22px;
  border-color: #fff; border-style: solid;
}
.qr-corners::before         { top:0;    left:0;  border-width: 3px 0 0 3px; }
.qr-corners::after          { top:0;    right:0; border-width: 3px 3px 0 0; }
.qr-corners > span::before  { bottom:0; left:0;  border-width: 0 0 3px 3px; }
.qr-corners > span::after   { bottom:0; right:0; border-width: 0 3px 3px 0; }

/* 대기 상태 */
.state-idle {
  display: flex; flex-direction: column;
  align-items: center; gap: 10px;
  z-index: 4; pointer-events: none;
}
.qr-icon {
  width: 68px; height: 68px;
  border: 3px solid #555;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows:    1fr 1fr 1fr;
  gap: 4px; padding: 8px;
}
.qr-icon span       { background: #555; display: block; }
.qr-icon span.empty { background: transparent; }
.state-idle p { font-size: 13px; color: #888; letter-spacing: .2px; }

/* 에러 상태 */
.state-err {
  display: none; flex-direction: column;
  align-items: center; gap: 8px;
  z-index: 4; pointer-events: none;
  padding: 0 24px; text-align: center;
}
.state-err strong { font-size: 13px; color: #bbb; }
.state-err p      { font-size: 12px; color: #888; line-height: 1.6; }

/* 스캔 중 안내 */
.scan-tip {
  position: absolute; bottom: 10px; left: 0; right: 0;
  text-align: center; font-size: 12px; font-weight: 600;
  color: rgba(255,255,255,.85); letter-spacing: .3px;
  z-index: 8; display: none;
}
.scan-tip.active { display: block; }

/* ===== SEARCH AREA ===== */
.search-area {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px;
  background: #fff; border-bottom: 2px solid #111;
  flex-shrink: 0;
}
.search-input {
  flex: 1; height: 52px;
  border: 2px solid #111; border-radius: 0;
  font-size: 15px; padding: 0 14px;
  color: #111; background: #fff; outline: none;
  font-family: inherit;
}
.search-input::placeholder { color: #bbb; font-size: 13px; }
.search-input:focus { background: #fafafa; }
.btn-search {
  height: 52px; padding: 0 20px;
  background: #111; color: #fff;
  border: none; border-radius: 0;
  font-size: 15px; font-weight: 700;
  cursor: pointer; white-space: nowrap;
  min-width: 68px; font-family: inherit;
}
.btn-search:disabled { background: #aaa; cursor: default; }

/* ===== SCAN STATS ===== */
.scan-stats {
  padding: 11px 16px;
  background: #fff; border-bottom: 1px solid #ddd;
  display: none; flex-shrink: 0;
  align-items: center; justify-content: space-between;
}
.scan-stats.on { display: flex; }
.stats-text { font-size: 14px; font-weight: 700; color: #111; }
.stats-text .n { font-size: 18px; font-weight: 900; }
.stats-text .t { font-size: 18px; font-weight: 900; color: #555; }
.prog-wrap { width: 100px; height: 5px; background: #e0e0e0; overflow: hidden; }
.prog-fill { height: 100%; background: #111; width: 0%; transition: width .35s ease; }

/* ===== EMPTY STATE ===== */
.empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px; padding: 32px 20px;
}
.empty-state p     { font-size: 15px; color: #888; text-align: center; line-height: 1.75; }
.empty-state small { font-size: 12px; color: #bbb; text-align: center; }

/* ===== LIST AREA ===== */
.list-wrap {
  flex: 1; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: none; flex-direction: column;
  background: #f5f5f5;
}
.list-wrap.on { display: flex; }
.list-wrap::-webkit-scrollbar { width: 3px; }
.list-wrap::-webkit-scrollbar-track { background: #efefef; }
.list-wrap::-webkit-scrollbar-thumb { background: #ccc; }

.list-hd {
  padding: 9px 16px;
  background: #e8e8e8; border-bottom: 1px solid #ddd;
  font-size: 12px; font-weight: 700; color: #555;
  letter-spacing: .4px;
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; z-index: 10; flex-shrink: 0;
}
.list-hd .list-cnt { font-weight: 400; color: #888; font-size: 12px; }

/* 차량 카드 */
.v-card {
  background: #fff; border-bottom: 1px solid #e8e8e8;
  padding: 14px 16px;
  display: flex; gap: 14px; align-items: flex-start;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(-10px); background: #ddd; }
  to   { opacity: 1; transform: translateY(0);     background: #fff; }
}
.v-card.anim-new { animation: cardIn .35s ease forwards; }
@keyframes cardDup {
  0%,100% { background: #fff; }
  30%     { background: #e0e0e0; }
}
.v-card.anim-dup { animation: cardDup .65s ease; }

.badge-wrap { flex-shrink: 0; padding-top: 2px; }
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 52px; height: 26px;
  font-size: 12px; font-weight: 800; letter-spacing: .8px;
  border: 2px solid #111; border-radius: 0;
  background: #111; color: #fff;
}

/* QR 원문 표시 (DB 없을 때) */
.v-info { flex: 1; min-width: 0; }
.v-raw  {
  font-size: 13px; font-weight: 700; color: #111;
  word-break: break-all; line-height: 1.5;
  font-family: 'Courier New', monospace; letter-spacing: .3px;
}
.v-time {
  font-size: 11px; color: #999; margin-top: 5px; font-weight: 500;
}
.v-seq {
  font-size: 11px; color: #bbb; margin-top: 2px;
}

/* ===== FOOTER ===== */
.footer {
  background: #fff; border-top: 2px solid #111;
  padding: 14px 16px;
  padding-bottom: calc(14px + env(safe-area-inset-bottom));
  flex-shrink: 0;
}
.btn-complete {
  width: 100%; height: 60px;
  background: #111; color: #fff;
  border: none; border-radius: 0;
  font-size: 17px; font-weight: 800;
  letter-spacing: 1px; font-family: inherit; cursor: pointer;
}
.btn-complete:active { background: #333; }

/* ===== DIALOG ===== */
.dlg-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  z-index: 2000; display: none;
  align-items: center; justify-content: center;
}
.dlg-overlay.on { display: flex; }
.dlg-box { background: #fff; width: min(88vw, 320px); border: 2px solid #111; }
.dlg-msg {
  padding: 28px 20px 22px;
  font-size: 15px; color: #111; text-align: center;
  line-height: 1.7; font-weight: 500; word-break: keep-all;
}
.dlg-btns { display: flex; border-top: 1px solid #ddd; }
.dlg-btns button {
  flex: 1; height: 56px; border: none; border-radius: 0;
  font-size: 16px; font-weight: 700;
  cursor: pointer; background: #fff; color: #111; font-family: inherit;
}
.dlg-btns button + button { border-left: 1px solid #ddd; }
.dlg-btns button.primary  { background: #111; color: #fff; }

/* ===== TOAST ===== */
.toast {
  position: fixed; bottom: 100px; left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: #222; color: #fff;
  padding: 13px 22px; font-size: 14px; font-weight: 600;
  border-radius: 0; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 3000; max-width: 90vw;
  text-align: center; word-break: keep-all; line-height: 1.5;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- STATUS BAR -->
<div class="status-bar">
  <span class="time" id="sTime">09:41</span>
  <div class="icons">
    <div class="signal">
      <span></span><span></span><span></span><span></span>
    </div>
    <span class="net-label">5G</span>
    <div class="battery">
      <div class="batt-body"><div class="batt-fill"></div></div>
      <div class="batt-cap"></div>
    </div>
    <span class="batt-pct">88%</span>
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <button class="btn-back" onclick="goBack()">&#8249;</button>
  <div class="header-title">재고실사</div>
</div>

<!-- BODY -->
<div class="body">

  <!-- 실사번호 텍스트 -->
  <div class="inv-area">
    <span class="inv-label">실사번호</span>
    <span class="inv-value">INV-2026-05-001</span>
  </div>

  <!-- QR 뷰포트 -->
  <div class="qr-area">
    <div class="qr-viewport" id="qrViewport">

      <video id="qrVideo" playsinline autoplay muted></video>
      <canvas id="qrCanvas"></canvas>

      <div class="scan-line" id="scanLine"></div>
      <div class="qr-corners"><span></span></div>

      <!-- 대기 -->
      <div class="state-idle" id="stateIdle">
        <div class="qr-icon">
          <span></span><span></span><span></span>
          <span></span><span class="empty"></span><span></span>
          <span></span><span></span><span></span>
        </div>
        <p>터치하여 QR 스캔 시작</p>
      </div>

      <!-- 에러 -->
      <div class="state-err" id="stateErr">
        <strong>카메라를 사용할 수 없습니다</strong>
        <p>브라우저 카메라 권한을<br>확인해 주세요.</p>
      </div>

      <!-- 스캔 중 안내 -->
      <div class="scan-tip" id="scanTip">● 스캔 중 &nbsp;|&nbsp; 터치하면 종료</div>

    </div>
  </div>

  <!-- 검색 -->
  <div class="search-area">
    <input class="search-input" type="tel" id="searchInput"
      maxlength="4" placeholder="차량번호 4자리 입력"
      inputmode="numeric"
      oninput="onSearchInput()"
      onkeydown="onSearchKey(event)">
    <button class="btn-search" id="btnSearch" onclick="doSearch()" disabled>검색</button>
  </div>

  <!-- 스캔 통계 -->
  <div class="scan-stats" id="scanStats">
    <div class="stats-text">
      스캔 <span class="n" id="scanCnt">0</span>건
      &nbsp;/&nbsp;
      목표 <span class="t">1,000</span>건
    </div>
    <div class="prog-wrap">
      <div class="prog-fill" id="progFill"></div>
    </div>
  </div>

  <!-- 빈 상태 -->
  <div class="empty-state" id="emptyState">
    <p>QR스캔 또는 차량번호 검색을<br>진행해 주세요.</p>
    <small>위 QR 영역을 터치하면 카메라가 실행됩니다</small>
  </div>

  <!-- 차량 목록 -->
  <div class="list-wrap" id="listWrap">
    <div class="list-hd">
      <span>스캔 결과 목록</span>
      <span class="list-cnt" id="listCnt"></span>
    </div>
    <div id="vehicleList"></div>
  </div>

</div><!-- /body -->

<!-- FOOTER -->
<div class="footer">
  <button class="btn-complete" onclick="showCompleteConfirm()">재고실사 처리</button>
</div>

<!-- DIALOG -->
<div class="dlg-overlay" id="dlgOverlay">
  <div class="dlg-box">
    <div class="dlg-msg" id="dlgMsg"></div>
    <div class="dlg-btns" id="dlgBtns"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   STATE
   ============================================================ */
const TARGET     = 1000;
let scannedCount = 0;   /* 중복 제외 순수 신규 스캔 건수 */
let isScanning   = false;
let videoStream  = null;
let rafId        = null;
let hasResult    = false;
let lastQrData   = '';   /* 직전 인식 QR 원문 (쿨다운용) */
let lastQrTime   = 0;    /* 직전 인식 시각 ms */

/*
  scannedList: 스캔된 QR 결과 목록
  항목 구조: { id, rawData, scannedAt }
  - id       : 고유 식별자 (rawData 기준, 중복 판별용)
  - rawData  : jsQR이 읽은 QR 원문 그대로
  - scannedAt: 스캔 시각 (Date 객체)
*/
let scannedList = [];

/* ============================================================
   STATUS BAR CLOCK
   ============================================================ */
(function tick() {
  const n = new Date();
  document.getElementById('sTime').textContent =
    String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  setTimeout(tick, 15000);
})();

/* ============================================================
   DOM refs
   ============================================================ */
const qrViewport = document.getElementById('qrViewport');
const qrVideo    = document.getElementById('qrVideo');
const qrCanvas   = document.getElementById('qrCanvas');
const scanLine   = document.getElementById('scanLine');
const scanTip    = document.getElementById('scanTip');
const stateIdle  = document.getElementById('stateIdle');
const stateErr   = document.getElementById('stateErr');

/* ============================================================
   QR 뷰포트 터치 → 카메라 ON / OFF
   ============================================================ */
qrViewport.addEventListener('click', () => {
  isScanning ? stopCamera() : startCamera();
});

/* ============================================================
   START CAMERA
   ============================================================ */
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
    });

    videoStream       = stream;
    qrVideo.srcObject = stream;
    await qrVideo.play();
    qrVideo.classList.add('active');

    stateIdle.style.display = 'none';
    stateErr.style.display  = 'none';
    scanLine.classList.add('active');
    scanTip.classList.add('active');
    isScanning = true;

    scanLoop();

  } catch (err) {
    console.warn('[Camera]', err.name, err.message);
    stateIdle.style.display = 'none';
    stateErr.style.display  = 'flex';
    isScanning = false;
  }
}

/* ============================================================
   STOP CAMERA
   ============================================================ */
function stopCamera() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }

  if (videoStream) {
    videoStream.getTracks().forEach(t => t.stop());
    videoStream = null;
  }
  qrVideo.srcObject = null;
  qrVideo.classList.remove('active');

  scanLine.classList.remove('active');
  scanTip.classList.remove('active');
  stateIdle.style.display = 'flex';
  stateErr.style.display  = 'none';
  isScanning = false;
  lastQrData = '';
  lastQrTime = 0;
}

/* ============================================================
   SCAN LOOP — requestAnimationFrame + jsQR
   매 프레임 캔버스에 영상 캡처 → jsQR 디코딩
   ============================================================ */
function scanLoop() {
  if (!isScanning) return;

  if (qrVideo.readyState === qrVideo.HAVE_ENOUGH_DATA) {
    const w = qrVideo.videoWidth;
    const h = qrVideo.videoHeight;

    if (w > 0 && h > 0) {
      qrCanvas.width  = w;
      qrCanvas.height = h;
      const ctx = qrCanvas.getContext('2d');
      ctx.drawImage(qrVideo, 0, 0, w, h);

      const imgData = ctx.getImageData(0, 0, w, h);
      const code    = jsQR(imgData.data, w, h, { inversionAttempts: 'dontInvert' });

      if (code) {
        const now  = Date.now();
        const data = code.data.trim();

        /* 동일 QR 2초 쿨다운 — 연속 중복 인식 방지 */
        if (data !== lastQrData || now - lastQrTime > 2000) {
          lastQrData = data;
          lastQrTime = now;
          processScan(data);  /* QR 원문 그대로 전달 */
        }
      }
    }
  }

  rafId = requestAnimationFrame(scanLoop);
}

/* ============================================================
   PROCESS SCAN
   - vehicleDB 없음
   - jsQR이 읽은 rawData 문자열 그대로 목록에 등록
   - 동일 rawData가 이미 있으면 중복 처리 (최상단 이동)
   ============================================================ */
function processScan(rawData) {
  const now      = new Date();
  const existIdx = scannedList.findIndex(item => item.id === rawData);

  if (existIdx !== -1) {
    /* ── 중복 스캔: 최상단 이동 + 시각 갱신 ── */
    const item = scannedList.splice(existIdx, 1)[0];
    item.scannedAt = now;
    scannedList.unshift(item);
    renderList('dup', rawData);
    showToast('이미 스캔된 QR입니다.');
  } else {
    /* ── 신규 스캔: 최상단 추가 ── */
    scannedCount++;
    scannedList.unshift({ id: rawData, rawData, scannedAt: now });
    renderList('new', rawData);
    updateStats();
    showToast('스캔 완료');
  }

  showResults();
}

/* ============================================================
   RENDER LIST
   - scannedList 순서 그대로 (index 0 = 최신)
   - QR 원문을 카드에 그대로 표시
   ============================================================ */
function renderList(animType, targetId) {
  const container = document.getElementById('vehicleList');
  container.innerHTML = '';

  scannedList.forEach((item, idx) => {
    const card = document.createElement('div');
    let   cls  = 'v-card';
    if (item.id === targetId) cls += animType === 'new' ? ' anim-new' : ' anim-dup';
    card.className = cls;
    card.setAttribute('data-id', item.id);

    /* 스캔 시각 포맷 */
    const t  = item.scannedAt;
    const hh = String(t.getHours()).padStart(2,'0');
    const mm = String(t.getMinutes()).padStart(2,'0');
    const ss = String(t.getSeconds()).padStart(2,'0');
    const timeStr = `${hh}:${mm}:${ss}`;

    /* 순번: 최신이 1번 */
    const seq = idx + 1;

    card.innerHTML = `
      <div class="badge-wrap">
        <span class="badge">스캔</span>
      </div>
      <div class="v-info">
        <div class="v-raw">${escHtml(item.rawData)}</div>
        <div class="v-time">스캔시각 ${timeStr}</div>
        <div class="v-seq"># ${seq}</div>
      </div>`;
    container.appendChild(card);
  });

  document.getElementById('listCnt').textContent = scannedList.length + '건';
  document.getElementById('listWrap').scrollTop  = 0;
}

/* HTML 이스케이프 (XSS 방지) */
function escHtml(str) {
  return str
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ============================================================
   SHOW RESULTS / STATS
   ============================================================ */
function showResults() {
  if (!hasResult) {
    hasResult = true;
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('scanStats').classList.add('on');
    document.getElementById('listWrap').classList.add('on');
  }
}

function updateStats() {
  document.getElementById('scanCnt').textContent  = scannedCount.toLocaleString();
  document.getElementById('progFill').style.width = Math.min(scannedCount / TARGET * 100, 100) + '%';
}

/* ============================================================
   SEARCH — 차량번호 4자리
   ※ vehicleDB 없음: 검색 기능은 "스캔된 목록 내 QR 원문 검색"으로 동작
   ============================================================ */
function onSearchInput() {
  const v = document.getElementById('searchInput').value.replace(/\D/g, '');
  document.getElementById('searchInput').value = v;
  document.getElementById('btnSearch').disabled = v.length < 4;
}
function onSearchKey(e) {
  if (e.key === 'Enter') { document.getElementById('searchInput').blur(); doSearch(); }
}
function doSearch() {
  const val = document.getElementById('searchInput').value;
  if (!val || val.length < 4) {
    showDlg('차량번호 4자리를 입력해 주세요.', [{ label:'확인', cls:'primary', fn: closeDlg }]);
    return;
  }
  /* 스캔된 목록 내에서 QR 원문에 입력값 포함 여부로 검색 */
  const matched = scannedList.filter(item => item.rawData.includes(val));
  if (!matched.length) {
    showDlg('스캔 목록에서 검색 결과가 없습니다.', [{ label:'확인', cls:'primary', fn: closeDlg }]);
    return;
  }
  /* 검색된 항목을 최상단으로 이동 */
  showDlg(
    `"${val}" 포함 ${matched.length}건을\n목록 최상단으로 이동합니다.`,
    [
      { label:'취소', cls:'',        fn: closeDlg },
      { label:'확인', cls:'primary', fn: () => {
          closeDlg();
          matched.forEach(m => {
            const idx = scannedList.findIndex(i => i.id === m.id);
            if (idx !== -1) {
              const item = scannedList.splice(idx, 1)[0];
              scannedList.unshift(item);
            }
          });
          renderList(null, null);
          showToast(`${matched.length}건 검색 완료`);
        }
      }
    ]
  );
}

/* ============================================================
   COMPLETE
   ============================================================ */
function showCompleteConfirm() {
  if (!hasResult || scannedCount === 0) {
    showDlg('스캔된 차량이 없습니다.\nQR스캔 후 진행해 주세요.', [
      { label:'확인', cls:'primary', fn: closeDlg }
    ]);
    return;
  }
  showDlg(
    `스캔 완료 ${scannedCount}건을\n재고실사 처리하시겠습니까?\n\n처리 후 수정이 불가합니다.`,
    [
      { label:'취소', cls:'',        fn: closeDlg },
      { label:'확인', cls:'primary', fn: doComplete }
    ]
  );
}
function doComplete() {
  closeDlg();
  stopCamera();
  showToast('재고실사 처리가 완료되었습니다.');
  setTimeout(() => {
    scannedList  = [];
    scannedCount = 0;
    hasResult    = false;
    updateStats();
    document.getElementById('emptyState').style.display = 'flex';
    document.getElementById('scanStats').classList.remove('on');
    document.getElementById('listWrap').classList.remove('on');
    document.getElementById('vehicleList').innerHTML = '';
    document.getElementById('listCnt').textContent   = '';
    document.getElementById('searchInput').value     = '';
    document.getElementById('btnSearch').disabled    = true;
  }, 2400);
}

/* ============================================================
   BACK
   ============================================================ */
function goBack() {
  showDlg('재고실사 화면을 나가시겠습니까?', [
    { label:'취소',   cls:'',        fn: closeDlg },
    { label:'나가기', cls:'primary', fn: () => { closeDlg(); stopCamera(); showToast('LNB 메뉴로 이동합니다.'); } }
  ]);
}

/* ============================================================
   DIALOG
   ============================================================ */
function showDlg(msg, buttons) {
  document.getElementById('dlgMsg').innerHTML = msg.replace(/\n/g,'<br>');
  const wrap = document.getElementById('dlgBtns');
  wrap.innerHTML = '';
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.textContent = b.label;
    if (b.cls === 'primary') btn.classList.add('primary');
    btn.addEventListener('click', b.fn);
    wrap.appendChild(btn);
  });
  document.getElementById('dlgOverlay').classList.add('on');
}
function closeDlg() { document.getElementById('dlgOverlay').classList.remove('on'); }

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}
</script>
</body>
</html>
