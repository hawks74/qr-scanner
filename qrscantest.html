<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GD_MO_0900 재고실사</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  width: 100%; height: 100%;
  background: #f5f5f5;
  font-family: 'Malgun Gothic', '맑은 고딕', -apple-system, sans-serif;
  color: #111; overflow: hidden;
}
body { display: flex; flex-direction: column; height: 100dvh; }

/* ===== HEADER ===== */
.header {
  background: #111; color: #fff;
  display: flex; align-items: center; justify-content: center;
  height: 56px; padding: 0 16px; flex-shrink: 0;
}
.header-title {
  font-size: 17px; font-weight: 700; letter-spacing: -.2px;
  text-align: center; white-space: nowrap;
}

/* ===== BODY ===== */
.body {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden; background: #f5f5f5;
}

/* ===== LIST 헤더 높이 변수 공유 =====
   list-hd 실제 높이 = padding 10px*2 + font ≒ 40px
   QR 영역 = 50dvh + 40px (list-hd 높이만큼 확장)       */

/* ===== QR SCAN AREA ===== */
.qr-area {
  background: #000;
  border-bottom: 2px solid #111;
  flex-shrink: 0;
  /* 50dvh + list-hd 높이(40px) */
  height: calc(50dvh + 40px);
}
.qr-viewport {
  width: 100%; height: 100%;
  background: #111; border: none;
  position: relative; overflow: hidden;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
#qrVideo {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; display: none;
}
#qrVideo.active { display: block; }
#qrCanvas { display: none; }

/* 스캔 라인 */
.scan-line {
  position: absolute; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg,
    transparent 0%, rgba(255,255,255,.95) 50%, transparent 100%);
  display: none; z-index: 6;
  animation: scanMove 1.6s ease-in-out infinite;
}
.scan-line.active { display: block; }
@keyframes scanMove { 0%{top:4%} 50%{top:93%} 100%{top:4%} }

/* 코너 브라켓 */
.qr-corners { position: absolute; inset: 16px; pointer-events: none; z-index: 7; }
.qr-corners::before, .qr-corners::after,
.qr-corners > span::before, .qr-corners > span::after {
  content: ''; position: absolute;
  width: 24px; height: 24px;
  border-color: #fff; border-style: solid;
}
.qr-corners::before         { top:0;    left:0;  border-width: 4px 0 0 4px; }
.qr-corners::after          { top:0;    right:0; border-width: 4px 4px 0 0; }
.qr-corners > span::before  { bottom:0; left:0;  border-width: 0 0 4px 4px; }
.qr-corners > span::after   { bottom:0; right:0; border-width: 0 4px 4px 0; }

/* 대기 상태 */
.state-idle {
  display: flex; flex-direction: column;
  align-items: center; gap: 14px;
  z-index: 4; pointer-events: none;
}
.qr-icon {
  width: 72px; height: 72px; border: 4px solid #555;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows:    1fr 1fr 1fr;
  gap: 4px; padding: 8px;
}
.qr-icon span       { background: #555; display: block; }
.qr-icon span.empty { background: transparent; }
.state-idle p { font-size: 14px; color: #888; }

/* 에러 상태 */
.state-err {
  display: none; flex-direction: column;
  align-items: center; gap: 8px;
  z-index: 4; pointer-events: none;
  padding: 0 24px; text-align: center;
}
.state-err strong { font-size: 14px; color: #bbb; }
.state-err p      { font-size: 13px; color: #888; line-height: 1.6; }

/* 스캔 중 하단 안내 */
.scan-tip {
  position: absolute; bottom: 14px; left: 0; right: 0;
  text-align: center; font-size: 13px; font-weight: 600;
  color: rgba(255,255,255,.85); z-index: 8; display: none;
}
.scan-tip.active { display: block; }

/* ===== LIST AREA ===== */
.list-wrap {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden; background: #f5f5f5;
}

/* 리스트 헤더 : height 40px 고정 */
.list-hd {
  height: 40px;
  padding: 0 16px;
  background: #e8e8e8; border-bottom: 1px solid #ddd;
  font-size: 12px; font-weight: 700; color: #555;
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0;
}
.list-cnt { font-weight: 400; color: #888; font-size: 12px; }

/* 빈 상태 */
.empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px; padding: 24px 20px;
}
.empty-state p     { font-size: 14px; color: #888; text-align: center; line-height: 1.75; }
.empty-state small { font-size: 12px; color: #bbb; text-align: center; }

/* 스크롤 목록 */
.list-scroll {
  flex: 1; overflow-y: auto;
  -webkit-overflow-scrolling: touch; display: none;
}
.list-scroll.on { display: block; }
.list-scroll::-webkit-scrollbar { width: 3px; }
.list-scroll::-webkit-scrollbar-track { background: #efefef; }
.list-scroll::-webkit-scrollbar-thumb { background: #ccc; }

/* 차량 카드 */
.v-card {
  background: #fff; border-bottom: 1px solid #e8e8e8;
  padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(-8px); background: #ddd; }
  to   { opacity: 1; transform: translateY(0);    background: #fff; }
}
.v-card.anim-new { animation: cardIn .3s ease forwards; }
@keyframes cardDup {
  0%,100% { background: #fff; }
  30%     { background: #e0e0e0; }
}
.v-card.anim-dup { animation: cardDup .6s ease; }

.badge-wrap { flex-shrink: 0; padding-top: 2px; }
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 52px; height: 26px;
  font-size: 12px; font-weight: 800; letter-spacing: .8px;
  border: 2px solid #111; border-radius: 0;
  background: #111; color: #fff;
}
.v-info { flex: 1; min-width: 0; }
.v-raw {
  font-size: 13px; font-weight: 700; color: #111;
  word-break: break-all; line-height: 1.5;
  font-family: 'Courier New', monospace; letter-spacing: .3px; margin-bottom: 5px;
}
.v-meta { font-size: 11px; color: #999; font-weight: 500; display: flex; gap: 10px; }
.v-meta .v-seq { color: #ccc; }

/* ===== DIALOG ===== */
.dlg-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  z-index: 2000; display: none; align-items: center; justify-content: center;
}
.dlg-overlay.on { display: flex; }
.dlg-box { background: #fff; width: min(88vw, 320px); border: 2px solid #111; }
.dlg-msg {
  padding: 28px 20px 22px; font-size: 15px; color: #111;
  text-align: center; line-height: 1.7; font-weight: 500; word-break: keep-all;
}
.dlg-btns { display: flex; border-top: 1px solid #ddd; }
.dlg-btns button {
  flex: 1; height: 56px; border: none; border-radius: 0;
  font-size: 16px; font-weight: 700;
  cursor: pointer; background: #fff; color: #111; font-family: inherit;
}
.dlg-btns button + button { border-left: 1px solid #ddd; }
.dlg-btns button.primary  { background: #111; color: #fff; }

/* ===== TOAST ===== */
.toast {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: #222; color: #fff;
  padding: 12px 22px; font-size: 14px; font-weight: 600;
  border-radius: 0; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 3000; max-width: 90vw;
  text-align: center; word-break: keep-all; line-height: 1.5;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-title">재고실사 (INV-2026-05-001)</div>
</div>

<!-- BODY -->
<div class="body">

  <!-- QR 스캔 : calc(50dvh + 40px) -->
  <div class="qr-area">
    <div class="qr-viewport" id="qrViewport">

      <video id="qrVideo" playsinline autoplay muted></video>
      <canvas id="qrCanvas"></canvas>
      <div class="scan-line" id="scanLine"></div>
      <div class="qr-corners"><span></span></div>

      <!-- 대기 -->
      <div class="state-idle" id="stateIdle">
        <div class="qr-icon">
          <span></span><span></span><span></span>
          <span></span><span class="empty"></span><span></span>
          <span></span><span></span><span></span>
        </div>
        <p>터치하여 QR 스캔 시작</p>
      </div>

      <!-- 에러 -->
      <div class="state-err" id="stateErr">
        <strong>카메라를 사용할 수 없습니다</strong>
        <p>브라우저 카메라 권한을<br>확인해 주세요.</p>
      </div>

      <!-- 스캔 중 안내 -->
      <div class="scan-tip" id="scanTip">● 스캔 중 &nbsp;|&nbsp; 터치하면 종료</div>

    </div>
  </div>

  <!-- 리스트 -->
  <div class="list-wrap">
    <div class="list-hd">
      <span>스캔 결과 목록</span>
      <span class="list-cnt" id="listCnt">0건</span>
    </div>
    <div class="empty-state" id="emptyState">
      <p>QR스캔을 진행해 주세요.</p>
      <small>위 QR 영역을 터치하면 카메라가 실행됩니다</small>
    </div>
    <div class="list-scroll" id="listScroll">
      <div id="vehicleList"></div>
    </div>
  </div>

</div>

<!-- DIALOG -->
<div class="dlg-overlay" id="dlgOverlay">
  <div class="dlg-box">
    <div class="dlg-msg" id="dlgMsg"></div>
    <div class="dlg-btns" id="dlgBtns"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ============================================================
   TTS — Web Speech API
   ============================================================ */
let ttsVoice     = null;
let ttsActivated = false;
let currentUtter = null;   /* GC 방지용 전역 참조 */

/* 한국어 음성 탐색 및 캐싱 */
function initTTSVoice() {
  if (!window.speechSynthesis) return;
  const find = () => {
    const voices = speechSynthesis.getVoices();
    ttsVoice =
      voices.find(v => v.lang === 'ko-KR' && v.localService) ||
      voices.find(v => v.lang === 'ko-KR') ||
      voices.find(v => v.lang.startsWith('ko')) ||
      null;
  };
  speechSynthesis.getVoices().length > 0
    ? find()
    : (speechSynthesis.onvoiceschanged = find);
}
initTTSVoice();

/*
  speak(text)
  안드로이드 크롬 대응:
  1. cancel() 선행 → 이전 발화 잔류 방지
  2. currentUtter 전역 유지 → GC 방지
  3. 50ms 후 paused 확인 → resume() 강제
*/
function speak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();

  const utter   = new SpeechSynthesisUtterance(text);
  utter.lang    = 'ko-KR';
  utter.rate    = 1.0;
  utter.pitch   = 1.0;
  utter.volume  = 1.0;
  if (ttsVoice) utter.voice = ttsVoice;

  utter.onerror = e => console.warn('[TTS Error]', e.error, text);

  currentUtter  = utter;   /* GC 방지 */
  speechSynthesis.speak(utter);

  /* 안드로이드 paused 버그 대응 */
  if (speechSynthesis.paused) speechSynthesis.resume();
  setTimeout(() => {
    if (window.speechSynthesis && speechSynthesis.paused) speechSynthesis.resume();
  }, 50);
}

/* TTS 워밍업 — 터치 시점에 컨텍스트 활성화 (소리 없음) */
function activateTTS() {
  if (ttsActivated || !window.speechSynthesis) return;
  const warmup  = new SpeechSynthesisUtterance('\u200B');
  warmup.volume = 0;
  warmup.lang   = 'ko-KR';
  speechSynthesis.speak(warmup);
  speechSynthesis.cancel();
  ttsActivated  = true;
}

/* ──────────────────────────────────────────
   3종 음성 발화
   ✅ 성공     : "성공"
   ❌ 실패     : "다시 스캔해주세요" 
   ⚠️ 중복    : "이미 스캔하셨습니다"
   ────────────────────────────────────────── */
function voiceSuccess() { speak('성공'); }
function voiceFail()    { speak('다시 스캔해주세요'); }
function voiceDup()     { speak('이미 스캔하셨습니다'); }

/* ============================================================
   STATE
   ============================================================ */
let scannedCount = 0;
let isScanning   = false;
let videoStream  = null;
let rafId        = null;
let hasResult    = false;
let lastQrData   = '';
let lastQrTime   = 0;
let scannedList  = [];

/* ============================================================
   DOM refs
   ============================================================ */
const qrViewport = document.getElementById('qrViewport');
const qrVideo    = document.getElementById('qrVideo');
const qrCanvas   = document.getElementById('qrCanvas');
const scanLine   = document.getElementById('scanLine');
const scanTip    = document.getElementById('scanTip');
const stateIdle  = document.getElementById('stateIdle');
const stateErr   = document.getElementById('stateErr');

/* ============================================================
   터치 → TTS 활성화 + 카메라 ON/OFF
   ============================================================ */
qrViewport.addEventListener('click', () => {
  activateTTS();
  isScanning ? stopCamera() : startCamera();
});

/* ============================================================
   START CAMERA
   ============================================================ */
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    videoStream       = stream;
    qrVideo.srcObject = stream;
    await qrVideo.play();
    qrVideo.classList.add('active');
    stateIdle.style.display = 'none';
    stateErr.style.display  = 'none';
    scanLine.classList.add('active');
    scanTip.classList.add('active');
    isScanning = true;
    scanLoop();
  } catch (err) {
    console.warn('[Camera]', err.name, err.message);
    stateIdle.style.display = 'none';
    stateErr.style.display  = 'flex';
    isScanning = false;
  }
}

/* ============================================================
   STOP CAMERA
   ============================================================ */
function stopCamera() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
  qrVideo.srcObject = null;
  qrVideo.classList.remove('active');
  scanLine.classList.remove('active');
  scanTip.classList.remove('active');
  stateIdle.style.display = 'flex';
  stateErr.style.display  = 'none';
  isScanning = false; lastQrData = ''; lastQrTime = 0;
}

/* ============================================================
   SCAN LOOP — requestAnimationFrame + jsQR
   ============================================================ */
function scanLoop() {
  if (!isScanning) return;
  if (qrVideo.readyState === qrVideo.HAVE_ENOUGH_DATA) {
    const w = qrVideo.videoWidth;
    const h = qrVideo.videoHeight;
    if (w > 0 && h > 0) {
      qrCanvas.width = w; qrCanvas.height = h;
      const ctx = qrCanvas.getContext('2d');
      ctx.drawImage(qrVideo, 0, 0, w, h);
      const imgData = ctx.getImageData(0, 0, w, h);
      const code    = jsQR(imgData.data, w, h, { inversionAttempts: 'dontInvert' });
      if (code) {
        const now  = Date.now();
        const data = code.data.trim();
        /* 동일 QR 2초 쿨다운 */
        if (data !== lastQrData || now - lastQrTime > 2000) {
          lastQrData = data;
          lastQrTime = now;
          processScan(data);
        }
      }
    }
  }
  rafId = requestAnimationFrame(scanLoop);
}

/* ============================================================
   PROCESS SCAN
   ============================================================ */
function processScan(rawData) {
  /* 빈 데이터 방어 */
  if (!rawData || rawData.length === 0) {
    voiceFail();                          /* ❌ "실패, 다시 스캔해주세요" */
    showToast('QR 인식 실패');
    return;
  }

  const now      = new Date();
  const existIdx = scannedList.findIndex(item => item.id === rawData);

  if (existIdx !== -1) {
    /* ⚠️ 중복 */
    const item = scannedList.splice(existIdx, 1)[0];
    item.scannedAt = now;
    scannedList.unshift(item);
    voiceDup();                           /* ⚠️ "이미 스캔하셨습니다" */
    renderList('dup', rawData);
    showToast('이미 스캔된 QR입니다.');
  } else {
    /* ✅ 신규 */
    scannedCount++;
    scannedList.unshift({ id: rawData, rawData, scannedAt: now });
    voiceSuccess();                       /* ✅ "성공" */
    renderList('new', rawData);
    showToast('스캔 완료');
  }

  showResults();
}

/* ============================================================
   RENDER LIST
   ============================================================ */
function renderList(animType, targetId) {
  const container = document.getElementById('vehicleList');
  container.innerHTML = '';

  scannedList.forEach((item, idx) => {
    const card = document.createElement('div');
    let   cls  = 'v-card';
    if (item.id === targetId) cls += animType === 'new' ? ' anim-new' : ' anim-dup';
    card.className = cls;
    card.setAttribute('data-id', item.id);

    const t  = item.scannedAt;
    const ts = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;

    card.innerHTML = `
      <div class="badge-wrap"><span class="badge">스캔</span></div>
      <div class="v-info">
        <div class="v-raw">${escHtml(item.rawData)}</div>
        <div class="v-meta">
          <span class="v-time">${ts}</span>
          <span class="v-seq"># ${idx + 1}</span>
        </div>
      </div>`;
    container.appendChild(card);
  });

  document.getElementById('listCnt').textContent  = scannedList.length + '건';
  document.getElementById('listScroll').scrollTop = 0;
}

function escHtml(str) {
  return str
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ============================================================
   SHOW RESULTS
   ============================================================ */
function showResults() {
  if (!hasResult) {
    hasResult = true;
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('listScroll').classList.add('on');
  }
}

/* ============================================================
   DIALOG
   ============================================================ */
function showDlg(msg, buttons) {
  document.getElementById('dlgMsg').innerHTML = msg.replace(/\n/g,'<br>');
  const wrap = document.getElementById('dlgBtns');
  wrap.innerHTML = '';
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.textContent = b.label;
    if (b.cls === 'primary') btn.classList.add('primary');
    btn.addEventListener('click', b.fn);
    wrap.appendChild(btn);
  });
  document.getElementById('dlgOverlay').classList.add('on');
}
function closeDlg() {
  document.getElementById('dlgOverlay').classList.remove('on');
}

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}
</script>
</body>
</html>
